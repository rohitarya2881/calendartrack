<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Monthly Productivity Planner & Expanded Sticker Generator</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #000;
    }

    body {
      margin: 0;
      padding: 0;
      background: #eef2f5;
    }

    /* Screen-Only Control Panel */
    .controls {
      background: #fff;
      padding: 15px;
      margin: 20px auto;
      max-width: 900px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 10pt;
      font-weight: bold;
    }

    .controls select, .controls button {
      padding: 6px 12px;
      font-size: 10pt;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .controls button {
      background: #000;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .controls button:hover {
      background: #333;
    }

    /* Print Page Styles */
    @page {
      size: A4 landscape;
      margin: 4mm;
    }

    .page {
      width: 289mm;
      height: 200mm;
      page-break-after: always;
      display: flex;
      flex-direction: column;
      margin: 0 auto 20px auto;
      background: #fff;
      padding: 4mm;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    .page:last-child {
      page-break-after: avoid;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000;
      padding-bottom: 2px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 16pt;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .legend {
      font-size: 7pt;
      display: flex;
      gap: 10px;
    }

    /* Calendar Grid */
    .calendar-container {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 4px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1.5px solid #000;
      border-left: 1.5px solid #000;
      background: #f4f4f4;
    }

    .weekday {
      border-right: 1.5px solid #000;
      border-bottom: 1.5px solid #000;
      text-align: center;
      padding: 2px 0;
      font-size: 7.5pt;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      /* grid-template-rows is set dynamically in JS since a month can need 5 or 6 rows */
      flex: 1;
      border-left: 1.5px solid #000;
    }

    /* Individual Calendar Box */
    .day-box {
      border-right: 1.5px solid #000;
      border-bottom: 1.5px solid #000;
      padding: 4px 5px 3px 5px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .day-box.empty {
      background: #fafafa;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #999;
      padding-bottom: 2px;
      margin-bottom: 3px;
      flex: 0 0 auto;
    }

    .day-num {
      font-weight: bold;
      font-size: 11pt;
      line-height: 1;
    }

    .day-weekday-tag {
      font-size: 5.5pt;
      color: #666;
      letter-spacing: 0.5px;
    }

    /* Metrics: each row is a label + an actual writable underline,
       sized big enough to fill in a number by hand */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 8px;
      font-size: 6.5pt;
      flex: 0 0 auto;
      margin-bottom: 3px;
    }

    .metric-item {
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .metric-item .m-label {
      font-weight: bold;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .metric-item .m-line {
      flex: 1;
      border-bottom: 1px solid #999;
      height: 11px;
    }

    .notes-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }

    .note-line {
      border-bottom: 1px dotted #bbb;
      flex: 1;
      min-height: 8px;
    }

    .score-check {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 6pt;
      border-top: 1px dashed #ccc;
      padding-top: 2px;
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .checkbox {
      display: inline-block;
      width: 8px;
      height: 8px;
      border: 1px solid #000;
      vertical-align: middle;
    }

    /* Bottom Summary Strip */
    .bottom-review {
      flex: 0 0 auto;
      border: 1.5px solid #000;
      padding: 3px 6px;
      display: flex;
      gap: 10px;
      max-height: 24mm;
    }

    .stats-panel {
      width: 35%;
      border-right: 1px solid #000;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stats-title {
      font-size: 7pt;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #000;
      margin-bottom: 2px;
    }

    .stat-item {
      font-size: 6.2pt;
      display: flex;
      justify-content: space-between;
    }

    .stat-line {
      flex: 1;
      border-bottom: 1px dotted #000;
      margin: 0 3px 2px 3px;
    }

    .reflection-panel {
      width: 65%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .ref-box {
      font-size: 6.5pt;
      display: flex;
      flex-direction: column;
    }

    .ref-box label {
      font-weight: bold;
    }

    .ref-input {
      border: 1px solid #ccc;
      flex: 1;
      min-height: 14px;
    }

    /* HIDE CONTROLS WHEN PRINTING */
    @media print {
      body {
        background: none;
      }
      .controls {
        display: none !important;
      }
      .page {
        margin: 0;
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
</head>

  <script>
    const monthNames = [
      "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
      "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
    ];

    function generatePages() {
      const year = parseInt(document.getElementById('yearSelect').value);
      const startM = parseInt(document.getElementById('startMonth').value);
      const endM = parseInt(document.getElementById('endMonth').value);
      const container = document.getElementById('calendarOutput');

      if (startM > endM) {
        alert("Start month cannot be after End month!");
        return;
      }

      container.innerHTML = '';

      for (let m = startM; m <= endM; m++) {
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        let firstDayIndex = new Date(year, m, 1).getDay();
        let startOffset = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        // Number of rows needed (5 or 6) depends on how the month falls
        let totalSlots = (startOffset + daysInMonth > 35) ? 42 : 35;
        let numRows = totalSlots / 7;

        let pageHtml = `
          <div class="page">
            <header>
              <h1>${monthNames[m]} ${year}</h1>
              <div class="legend">
                <b>ST:</b> Screen Time | <b>SH:</b> Study Hours | <b>MS:</b> Mock Score | <b>TC:</b> Tasks Done
              </div>
            </header>

            <div class="calendar-container">
              <div class="weekdays">
                <div class="weekday">MON</div>
                <div class="weekday">TUE</div>
                <div class="weekday">WED</div>
                <div class="weekday">THU</div>
                <div class="weekday">FRI</div>
                <div class="weekday">SAT</div>
                <div class="weekday">SUN</div>
              </div>
              <div class="days-grid" style="grid-template-rows: repeat(${numRows}, 1fr);">
        `;

        for (let i = 0; i < startOffset; i++) {
          pageHtml += `<div class="day-box empty"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          let dayStr = d < 10 ? '0' + d : d;
          pageHtml += `
            <div class="day-box">
              <div class="day-header">
                <span class="day-num">${dayStr}</span>
              </div>
              <div class="metrics-grid">
                <div class="metric-item"><span class="m-label">ST</span><span class="m-line"></span></div>
                <div class="metric-item"><span class="m-label">SH</span><span class="m-line"></span></div>
                <div class="metric-item"><span class="m-label">MS</span><span class="m-line"></span></div>
                <div class="metric-item"><span class="m-label">TC</span><span class="m-line"></span></div>
              </div>
              <div class="notes-area">
                <div class="note-line"></div>
                <div class="note-line"></div>
                <div class="note-line"></div>
              </div>
              <div class="score-check">
                <span>🟢 <span class="checkbox"></span></span>
                <span>🟡 <span class="checkbox"></span></span>
                <span>🔴 <span class="checkbox"></span></span>
              </div>
            </div>
          `;
        }

        let remaining = totalSlots - (startOffset + daysInMonth);
        for (let i = 0; i < remaining; i++) {
          pageHtml += `<div class="day-box empty"></div>`;
        }

        pageHtml += `
              </div>
            </div>

            <div class="bottom-review">
              <div class="stats-panel">
                <div class="stats-title">Monthly Summary</div>
                <div class="stat-item"><span>Total SH:</span><div class="stat-line"></div></div>
                <div class="stat-item"><span>Avg ST:</span><div class="stat-line"></div></div>
                <div class="stat-item"><span>Avg MS:</span><div class="stat-line"></div></div>
                <div class="stat-item"><span>Green/Red Days:</span><div class="stat-line"></div></div>
              </div>

              <div class="reflection-panel">
                <div class="ref-box"><label>Biggest Win:</label><div class="ref-input"></div></div>
                <div class="ref-box"><label>Biggest Distraction:</label><div class="ref-input"></div></div>
                <div class="ref-box"><label>Lessons Learned:</label><div class="ref-input"></div></div>
                <div class="ref-box"><label>Goals for Next Month:</label><div class="ref-input"></div></div>
              </div>
            </div>
          </div>
        `;

        container.innerHTML += pageHtml;
      }
    }

    function stickerDiv(type, icon, label, dark) {
      const cls = "sticker" + (type === "square" ? " square" : type === "badge" ? " badge" : "") + (dark ? " dark" : "");
      if (type === "badge") {
        return '<div class="' + cls + '">' + icon + ' ' + label + '</div>';
      }
      return '<div class="' + cls + '"><span class="icon">' + icon + '</span><span class="label">' + label + '</span></div>';
    }

    function buildCatalog() {
      const catalogView = document.getElementById('catalogView');
      let html = '';
      CATEGORIES.forEach((cat) => {
        html += '<div><div class="section-title">' + cat.title + '</div><div class="sticker-grid" style="grid-template-columns: repeat(' + cat.cols + ', 1fr);">';
        cat.items.forEach(([icon, label, dark]) => {
          html += stickerDiv(cat.type, icon, label, dark);
        });
        html += '</div></div>';
      });
      catalogView.innerHTML = html;
    }

        cat.items.forEach(([icon, label], ii) => {
          const id = ci + '-' + ii;
          html += '<div class="builder-row" id="row-' + id + '">' +
                    '<input type="checkbox" id="chk-' + id + '" onchange="onCheck(\\'' + id + '\\')">' +
                    '<span class="b-text">' + icon + ' ' + label + '</span>' +
                    '<input type="number" min="0" value="0" id="qty-' + id + '" oninput="onQty(\\'' + id + '\\')">' +
                  '</div>';
        });
        html += '</div>';
      });
      wrap.innerHTML = html;
    }

    function getItem(id) {
      const [ci, ii] = id.split('-').map(Number);
      const cat = CATEGORIES[ci];
      const [icon, label, dark] = cat.items[ii];
      return { icon, label, dark: !!dark, type: cat.type };
    }

    function onCheck(id) {
      const chk = document.getElementById('chk-' + id);
      const qty = document.getElementById('qty-' + id);
      if (chk.checked && Number(qty.value) === 0) qty.value = 10;
      if (!chk.checked) qty.value = 0;
      syncRow(id);
      updateSummary();
    }

    function onQty(id) {
      const qty = document.getElementById('qty-' + id);
      const chk = document.getElementById('chk-' + id);
      chk.checked = Number(qty.value) > 0;
      syncRow(id);
      updateSummary();
    }

    function syncRow(id) {
      const row = document.getElementById('row-' + id);
      const chk = document.getElementById('chk-' + id);
      row.classList.toggle('active', chk.checked);
    }

    function getSelected() {
      const selected = [];
      CATEGORIES.forEach((cat, ci) => {
        cat.items.forEach((item, ii) => {
          const id = ci + '-' + ii;
          const qty = Number(document.getElementById('qty-' + id).value) || 0;
          if (qty > 0) selected.push({ id, qty, ...getItem(id) });
        });
      });
      return selected;
    }

    function capacityFor(selected) {
      if (selected.length === 0) return { cols: 0, rows: 0, perPage: 0 };
      const maxW = Math.max(...selected.map(s => DIMS[s.type].w));
      const maxH = Math.max(...selected.map(s => DIMS[s.type].h));
      const gap = 4;
      const cols = Math.max(1, Math.floor(198 / (maxW + gap)));
      const rows = Math.max(1, Math.floor(283 / (maxH + gap)));
      return { cols, rows, perPage: cols * rows, maxW, maxH, gap };
    }

    function updateSummary() {
      const selected = getSelected();
      const bar = document.getElementById('summaryBar');
      if (selected.length === 0) {
        bar.innerHTML = 'Select stickers below and set how many of each you want.';
        return;
      }
      const total = selected.reduce((s, i) => s + i.qty, 0);
      const cap = capacityFor(selected);
      const pages = Math.ceil(total / cap.perPage);
      bar.innerHTML =
        selected.length + ' sticker type' + (selected.length > 1 ? 's' : '') + ' selected &nbsp;|&nbsp; ' +
        'Total copies: ' + total + ' &nbsp;|&nbsp; ' +
        'Fits ~' + cap.perPage + ' per page &nbsp;|&nbsp; ' +
        '<span style="color:#6f42c1;">Pages needed: ' + pages + '</span>' +
        '<span class="hint"> (some pages may mix 2–3 sticker types depending on leftovers)</span>';
    }

    function autoDistribute() {
      const selected = getSelected().length > 0 ? getSelected() : [];
      // if nothing has a qty yet, fall back to whatever is checked with qty 0 reset to at least 1 each
      let ids = [];
      CATEGORIES.forEach((cat, ci) => cat.items.forEach((item, ii) => {
        const id = ci + '-' + ii;
        if (document.getElementById('chk-' + id).checked) ids.push(id);
      }));
      if (ids.length === 0) { alert('Pehle kam se kam ek sticker select karo (checkbox tick karo).'); return; }

      const items = ids.map(id => ({ id, ...getItem(id) }));
      const cap = capacityFor(items);
      const pages = Math.max(1, Number(document.getElementById('desiredPages').value) || 1);
      const totalCapacity = pages * cap.perPage;
      const base = Math.floor(totalCapacity / ids.length);
      const remainder = totalCapacity - base * ids.length;
      ids.forEach((id, idx) => {
        const qty = base + (idx < remainder ? 1 : 0);
        document.getElementById('qty-' + id).value = qty;
      });
      updateSummary();
    }

    function generateCustomSheet() {
      const selected = getSelected();
      if (selected.length === 0) { alert('Pehle kam se kam ek sticker choose karo aur uski quantity set karo.'); return; }

      const cap = capacityFor(selected);
      // build the flat sequence of stickers to place (grouped by type, in the order selected)
      const sequence = [];
      selected.forEach(item => {
        for (let i = 0; i < item.qty; i++) sequence.push(item);
      });

      const totalPages = Math.ceil(sequence.length / cap.perPage);
      let html = '';
      for (let p = 0; p < totalPages; p++) {
        const pageItems = sequence.slice(p * cap.perPage, (p + 1) * cap.perPage);
        html += '<div class="custom-page">';
        html += '<div class="custom-page-label">Page ' + (p + 1) + ' of ' + totalPages + ' &mdash; ' + pageItems.length + ' stickers</div>';
        html += '<div class="custom-grid" style="grid-template-columns: repeat(' + cap.cols + ', ' + cap.maxW + 'mm); gap: ' + cap.gap + 'mm;">';
        pageItems.forEach(it => { html += stickerDiv(it.type, it.icon, it.label, it.dark); });
        html += '</div></div>';
      }

      document.getElementById('customSheetView').innerHTML = html;

      document.getElementById('catalogView').style.display = 'none';
      document.getElementById('builderView').style.display = 'none';
      document.getElementById('customSheetView').style.display = 'block';
      document.getElementById('btnPrintCatalog').style.display = 'none';
      document.getElementById('btnGoBuilder').style.display = 'none';
      document.getElementById('btnBackCatalog').style.display = 'none';
      document.getElementById('btnBackBuilder').style.display = 'inline-block';
      document.getElementById('btnPrintCustom').style.display = 'inline-block';
    }

    function showBuilder() {
      document.getElementById('catalogView').style.display = 'none';
      document.getElementById('customSheetView').style.display = 'none';
      document.getElementById('builderView').style.display = 'block';
      document.getElementById('btnPrintCatalog').style.display = 'none';
      document.getElementById('btnGoBuilder').style.display = 'none';
      document.getElementById('btnBackCatalog').style.display = 'inline-block';
      document.getElementById('btnBackBuilder').style.display = 'none';
      document.getElementById('btnPrintCustom').style.display = 'none';
      updateSummary();
    }

    function showCatalog() {
      document.getElementById('catalogView').style.display = 'flex';
      document.getElementById('builderView').style.display = 'none';
      document.getElementById('customSheetView').style.display = 'none';
      document.getElementById('btnPrintCatalog').style.display = 'inline-block';
      document.getElementById('btnGoBuilder').style.display = 'inline-block';
      document.getElementById('btnBackCatalog').style.display = 'none';
      document.getElementById('btnBackBuilder').style.display = 'none';
      document.getElementById('btnPrintCustom').style.display = 'none';
    }

    buildCatalog();
    buildBuilder();
  <\/script>
</body>
</html>`;
      stickerWindow.document.write(stickerHtml);
      stickerWindow.document.close();
    }

    window.onload = generatePages;
  </script>
